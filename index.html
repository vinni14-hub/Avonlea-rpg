<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPG Multiplayer Definitivo</title>
<style>
body{font-family:Arial,sans-serif;background:#1b1b1b;color:#fff;margin:0;padding:20px}
.card{max-width:700px;margin:auto;background:#292929;padding:20px;border-radius:16px}
button,input{padding:12px;margin:5px;border-radius:8px;border:0}
button{cursor:pointer}
#log{background:#111;padding:12px;border-radius:10px;min-height:120px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>RPG Multiplayer — versão definitiva</h1>
<p>Até 7 jogadores. A partida usa somente quem entrou; ninguém fica esperando jogador ausente.</p>
<label>Seu nome: <input id="name" maxlength="20"></label>
<br>
<button onclick="join()">Entrar na partida</button>
<button onclick="nextTurn()">Próximo turno</button>
<button onclick="save()">Salvar progresso</button>
<button onclick="resetGame()">Nova partida</button>
<h2>Jogadores presentes</h2>
<div id="players"></div>
<h2>Turno atual</h2>
<div id="turn"></div>
<h2>Registro</h2>
<div id="log"></div>
</div>
<script>
const KEY="rpg_definitivo_v1";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{players:[],turn:0,log:[]};

function save(){localStorage.setItem(KEY,JSON.stringify(state));render();alert("Progresso salvo neste dispositivo.");}
function join(){
 const n=document.getElementById("name").value.trim();
 if(!n)return alert("Digite seu nome.");
 if(state.players.length>=7 && !state.players.some(p=>p.name===n))return alert("A sala já tem 7 jogadores.");
 if(!state.players.some(p=>p.name===n)){
   state.players.push({name:n,hp:100,money:0,items:[],joined:true});
   state.log.push(n+" entrou na partida.");
 }
 save();
}
function nextTurn(){
 if(!state.players.length)return alert("Entre na partida primeiro.");
 state.turn=(state.turn+1)%state.players.length;
 state.log.push("Turno de "+state.players[state.turn].name+".");
 save();
}
function resetGame(){
 if(confirm("Apagar a partida deste dispositivo e começar outra?")){
  state={players:[],turn:0,log:[]};save();
 }
}
function render(){
 document.getElementById("players").innerHTML=state.players.length
 ? state.players.map((p,i)=>`<div>🎮 ${i+1}. <b>${p.name}</b> — HP ${p.hp} — 💰 ${p.money}</div>`).join("")
 : "Nenhum jogador entrou.";
 document.getElementById("turn").textContent=state.players.length
 ? state.players[state.turn%state.players.length].name : "Aguardando jogadores";
 document.getElementById("log").textContent=state.log.slice(-20).join("\n");
}
render();
</script>
</body>
</html>
